name: FleetFlow Kafka Replay Acceptance

# Runs against disposable local PostGIS and a real Kafka-compatible Redpanda
# container on the GitHub runner. No cloud credentials or paid infrastructure.
on:
  push:
    branches: ['feature/**', 'fix/**']
    paths:
      - 'backend/**'
      - 'db/init/03_dispatch_reliability.sql'
      - 'db/init/04_dispatch_quarantine.sql'
      - '.github/workflows/kafka-replay.yml'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'backend/**'
      - 'db/init/03_dispatch_reliability.sql'
      - 'db/init/04_dispatch_quarantine.sql'
      - '.github/workflows/kafka-replay.yml'

concurrency:
  group: kafka-replay-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  kafka-replay:
    name: Real broker, consumer restart and durable quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetpass
          POSTGRES_DB: fleetflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Guard in conftest.py rejects any other DB name or non-local host.
      DATABASE_URL: postgresql+asyncpg://fleetflow:fleetpass@localhost:5432/fleetflow_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetpass
      POSTGRES_DB: fleetflow_test
      KAFKA_BOOTSTRAP_SERVERS: localhost:19092
      FLEETFLOW_KAFKA_INTEGRATION: '1'
      JWT_SECRET_KEY: temporary-ci-fleetflow-integration-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python test dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'

      - name: Start a disposable real Kafka-compatible broker
        run: |
          docker run --detach --name fleetflow-redpanda --hostname fleetflow-redpanda \
            -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v25.1.1 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://fleetflow-redpanda:9092,external://localhost:19092 \
            --rpc-addr fleetflow-redpanda:33145 \
            --advertise-rpc-addr fleetflow-redpanda:33145 \
            --check=false
          timeout 100s bash -c 'until docker exec fleetflow-redpanda rpk cluster info -X brokers=127.0.0.1:9092; do sleep 2; done'

      - name: Bootstrap isolated PostGIS schema for migration exercise
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          import src.models  # register ORM metadata
          from src.database import Base, engine

          async def setup():
              async with engine.begin() as connection:
                  await connection.execute(text("CREATE EXTENSION IF NOT EXISTS postgis"))
                  await connection.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(setup())
          PY

      - name: Apply approved additive SQL migrations in isolated PostGIS
        run: |
          command -v psql
          PGPASSWORD=fleetpass psql -h localhost -U fleetflow -d fleetflow_test \
            -v ON_ERROR_STOP=1 -1 -f db/init/03_dispatch_reliability.sql
          PGPASSWORD=fleetpass psql -h localhost -U fleetflow -d fleetflow_test \
            -v ON_ERROR_STOP=1 -1 -f db/init/04_dispatch_quarantine.sql

      - name: Verify actual broker ACK, restart/redelivery and quarantine
        working-directory: backend
        run: |
          pytest tests/test_kafka/test_broker_replay.py -v -rs
          pytest tests/test_consumers/test_poison_offsets.py -v

      - name: Broker diagnostics on failure
        if: failure()
        run: docker logs --tail 100 fleetflow-redpanda || true

      - name: Teardown disposable broker
        if: always()
        run: docker rm -f fleetflow-redpanda || true
