name: One-Time Review Branch Formatting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-format.yml'

permissions:
  contents: write

jobs:
  formatter:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/p0-ci-evidence-2026-11-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict checkers
        run: pip install ruff black
      - name: Apply only safe import fixes and Black formatting
        run: |
          ruff check backend/src --fix --exit-zero
          black backend/src
      - name: Commit formatted files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src
          if ! git diff --cached --quiet; then
            git commit -m "style(p0): format current source after reliability fixes"
            git push origin HEAD:audit/p0-ci-evidence-2026-11-12
          fi
      - name: Report remaining checks, release CI remains strict
        run: |
          ruff check backend/src || true
          black --check backend/src
