name: One-Time FleetFlow Frontend Vulnerability Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-frontend-audit-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/p0-ci-evidence-2026-11-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update direct dependency vulnerabilities and resolve overrides
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add --save-exact next-auth@5.0.0-beta.32 drizzle-orm@0.45.2 maplibre-gl@6.4.1
          pnpm list next-auth drizzle-orm maplibre-gl @auth/core
      - name: Commit review-branch manifest and pnpm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Auth.js Drizzle MapLibre and stream dependencies"
            git push origin HEAD:audit/p0-ci-evidence-2026-11-12
          fi
