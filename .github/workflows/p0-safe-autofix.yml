name: P0 Safe Autofix (feature branch only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-safe-autofix.yml'

permissions:
  contents: write

jobs:
  safe-autofix:
    if: github.event.pull_request.head.ref == 'audit/p0-ci-evidence-2026-11-12' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch, never main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Python formatter tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install formatters
        run: python -m pip install ruff black
      - name: Apply safe Ruff fixes (no unsafe fixes)
        run: ruff check backend/src --fix --exit-zero
      - name: Format backend with Black
        run: black backend/src
      - name: Commit changes to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src
          if git diff --cached --quiet; then
            echo "No auto-fix changes"
          else
            git commit -m "style(p0): apply safe Ruff and Black source repairs"
            git push origin HEAD:audit/p0-ci-evidence-2026-11-12
          fi
      - name: Report remaining lint blockers without claiming a green check
        run: |
          ruff check backend/src || true
          black --check backend/src || true
          echo "This autofix workflow is not a release quality gate; Backend Tests is authoritative."
