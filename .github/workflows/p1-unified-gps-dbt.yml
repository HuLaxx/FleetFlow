name: FleetFlow P1 Unified GPS to dbt Golden Path

# Real browser -> FastAPI -> durable outbox -> Redpanda -> PostGIS
# -> authenticated same-process WebSocket -> browser. No mocked sockets,
# external credentials, cloud resources or production database access.
on:
  push:
    branches: ['feature/**', 'fix/**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/init/06_websocket_dispatch_scope.sql'
      - '.github/workflows/p1-unified-gps-dbt.yml'
      - 'data-engineering/dbt/**'
      - 'data-engineering/sql/**'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/init/06_websocket_dispatch_scope.sql'
      - '.github/workflows/gps-full-stack.yml'

concurrency:
  group: unified-gps-analytics-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-gps-browser:
    name: Same synthetic event through browser and real dbt
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetpass
          POSTGRES_DB: fleetflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetpass
      POSTGRES_DB: fleetflow_test
      DATABASE_URL: postgresql+asyncpg://fleetflow:fleetpass@localhost:5432/fleetflow_test
      KAFKA_BOOTSTRAP_SERVERS: localhost:19092
      GPS_E2E_EMAIL: gps-browser@example.test
      NEXT_PUBLIC_FASTAPI_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NEXT_TELEMETRY_DISABLED: '1'
      DBT_HOST: localhost
      DBT_USER: fleetflow
      DBT_PASSWORD: fleetpass
      DBT_DATABASE: fleetflow_test
      DBT_PROFILES_DIR: data-engineering/dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Generate disposable CI-only credentials
        run: |
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "GPS_E2E_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(28))')" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          python -m pip install -e './backend[dev,lake]'
          python -m pip install 'dbt-postgres>=1.9,<2'
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start disposable Kafka-compatible Redpanda
        run: |
          docker run --detach --name fleetflow-redpanda --hostname fleetflow-redpanda \
            -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v25.1.1 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://fleetflow-redpanda:9092,external://localhost:19092 \
            --rpc-addr fleetflow-redpanda:33145 \
            --advertise-rpc-addr fleetflow-redpanda:33145 \
            --check=false
          timeout 100s bash -c 'until docker exec fleetflow-redpanda rpk cluster info -X brokers=127.0.0.1:9092; do sleep 2; done'

      - name: Bootstrap isolated PostGIS and exercise additive migrations
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          import src.models
          from src.database import Base, engine

          assert engine.url.database == "fleetflow_test" and engine.url.host in ("localhost", "127.0.0.1")
          async def create():
              async with engine.begin() as connection:
                  await connection.execute(text("CREATE EXTENSION IF NOT EXISTS postgis"))
                  await connection.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(create())
          PY
          for file in db/init/03_dispatch_reliability.sql db/init/04_dispatch_quarantine.sql db/init/05_gps_tracking.sql db/init/06_websocket_dispatch_scope.sql; do
            PGPASSWORD=fleetpass psql -h localhost -U fleetflow -d fleetflow_test -v ON_ERROR_STOP=1 -1 -f "$file"
          done

      # Same CI run now proves the real solver/approval/dispatch DB slice before
      # the separate browser GPS-to-dbt slice. The pytest transaction rolls
      # back: this does NOT yet establish same-order identity across slices.
      - name: Verify real OR-Tools approval and dispatch slice in PostGIS
        run: |
          set -euo pipefail
          python -m pytest backend/tests/test_api/test_dispatch_planning.py \
            -k test_real_solver_persists_plan_then_requires_existing_explicit_approval \
            -q --junitxml="$RUNNER_TEMP/solver-approval-slice.xml"

      - name: Create a synthetic driver, vehicle and scoped login
        run: |
          python backend/scripts/seed_gps_browser_ci.py > "$RUNNER_TEMP/gps-fixture.json"
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "gps-fixture.json")) as f:
              record = json.load(f)
          print("GPS_E2E_DRIVER_ID=" + record["driver_id"])
          print("GPS_E2E_VEHICLE_ID=" + record["vehicle_id"])
          PY

      - name: Verify non-mocked GPS through actual Chromium
        run: |
          set -euo pipefail
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/gps-api.log" 2>&1 &
          api_pid=$!
          python -m src.reliability.worker --forever --interval 0.5 > "$RUNNER_TEMP/gps-outbox.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "FastAPI failed to start"
            tail -80 "$RUNNER_TEMP/gps-api.log"
            exit 1
          fi
          # Await actual Kafka group assignment, so earliest/latest
          # offset-reset races cannot hide a freshly submitted GPS event.
          for attempt in $(seq 1 40); do
            if docker exec fleetflow-redpanda rpk group describe gps-location-consumer -X brokers=127.0.0.1:9092 2>/dev/null | grep -q 'gps.location'; then
              break
            fi
            sleep 1
          done
          # Persist ONE actual source order and its solver/approval/dispatch
          # in the same database/driver/vehicle used by the browser GPS test.
          python backend/scripts/run_order_dispatch_browser_ci.py \
            --driver-id "$GPS_E2E_DRIVER_ID" \
            --vehicle-id "$GPS_E2E_VEHICLE_ID" \
            --output "$RUNNER_TEMP/order-dispatch.json"
          echo "GPS_E2E_ROUTE_ID=$(python -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ[\"RUNNER_TEMP\"])/\"order-dispatch.json\").read_text())[\"route_id\"])')" >> "$GITHUB_ENV"
          cd frontend
          pnpm exec playwright test e2e/gps-full-stack.spec.ts --reporter=line

      - name: Export the EXACT database-accepted browser GPS event
        run: |
          python backend/scripts/export_browser_outbox_gps_ci.py \
            --vehicle-id "$GPS_E2E_VEHICLE_ID" \
            --output "$RUNNER_TEMP/browser-gps.jsonl" > "$RUNNER_TEMP/browser-origin.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"])
          origin = json.loads((base / "browser-origin.json").read_text())
          event = json.loads((base / "browser-gps.jsonl").read_text())
          order = json.loads((base / "order-dispatch.json").read_text())
          assert order["solver"] == "ortools-cvrptw-haversine"
          assert order["approval_persisted"] and order["dispatch_persisted"]
          assert order["vehicle_id"] == origin["vehicle_id"]
          assert order["driver_id"] == origin["driver_id"]
          assert origin["vehicle_id"] == os.environ["GPS_E2E_VEHICLE_ID"]
          assert origin["event_id"] == event["event_id"]
          assert event["driver_id"] == os.environ["GPS_E2E_DRIVER_ID"]
          assert event["route_id"] == order["route_id"]
          print("PASS: WebSocket/consumer stored exact source event; browser ledger identity aligned")
          PY

      - name: Create independently reconciled Parquet from SAME source event
        run: |
          python -m src.lakehouse.replay \
            --input "$RUNNER_TEMP/browser-gps.jsonl" \
            --output "$RUNNER_TEMP/browser-lake" > "$RUNNER_TEMP/replay.json"
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "replay.json").read_text())
          print("UNIFIED_LAKE_RUN=" + data["run_dir"])
          PY
          # RUN_DIR from verified replay JSON, no dynamic shell evaluation.
          run_dir=$(python -c 'import json,os;from pathlib import Path;p=Path(os.environ["RUNNER_TEMP"])/"replay.json";print(json.loads(p.read_text())["run_dir"])')
          python -m src.lakehouse.reconcile "$run_dir" > "$RUNNER_TEMP/reconciled.json"

      - name: Load twice into same PostGIS and build actual dbt facts
        run: |
          set -euo pipefail
          PGPASSWORD=fleetpass psql -h localhost -U fleetflow -d fleetflow_test \
            -v ON_ERROR_STOP=1 -1 -f data-engineering/sql/01_gps_hourly_curated.sql
          python -m src.lakehouse.load_postgres "$UNIFIED_LAKE_RUN" > "$RUNNER_TEMP/loaded-first.json"
          python -m src.lakehouse.load_postgres "$UNIFIED_LAKE_RUN" > "$RUNNER_TEMP/loaded-second.json"
          dbt build --project-dir data-engineering/dbt --profiles-dir data-engineering/dbt --select +fct_gps_hourly

      - name: Independently reconcile one SAME-ID GPS event through dbt mart
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pyarrow.parquet as pq
          import psycopg2

          tmp = Path(os.environ["RUNNER_TEMP"])
          event = json.loads((tmp / "browser-gps.jsonl").read_text())
          origin = json.loads((tmp / "browser-origin.json").read_text())
          replay = json.loads((tmp / "replay.json").read_text())
          recon = json.loads((tmp / "reconciled.json").read_text())
          first = json.loads((tmp / "loaded-first.json").read_text())
          second = json.loads((tmp / "loaded-second.json").read_text())
          assert replay["source_sha256"] == origin["source_sha256"]
          assert recon["status"] == "reconciled"
          assert (recon["accepted"], recon["duplicates"], recon["late"]) == (1, 0, 0)
          assert (first["inserted_vehicle_hours"], second["inserted_vehicle_hours"]) == (1, 0)
          assert second["idempotent_existing_vehicle_hours"] == 1
          paths = sorted((Path(os.environ["UNIFIED_LAKE_RUN"]) / "clean").rglob("*.parquet"))
          assert len(paths) == 1
          clean = pq.ParquetFile(paths[0]).read().to_pylist()
          assert len(clean) == 1
          assert clean[0]["event_id"] == event["event_id"] == origin["event_id"]
          assert clean[0]["route_id"] == os.environ["GPS_E2E_ROUTE_ID"]
          assert clean[0]["vehicle_id"] == os.environ["GPS_E2E_VEHICLE_ID"]

          with psycopg2.connect(
              host="localhost", dbname="fleetflow_test",
              user="fleetflow", password="fleetpass"
          ) as conn, conn.cursor() as cursor:
              cursor.execute(
                  "SELECT vehicle_id::text, SUM(event_count), COUNT(*) "
                  "FROM public_marts.fct_gps_hourly GROUP BY vehicle_id"
              )
              rows = cursor.fetchall()
          assert rows == [(os.environ["GPS_E2E_VEHICLE_ID"], 1, 1)], rows
          (tmp / "analytics-observed.json").write_text(json.dumps({
              "event_id": event["event_id"],
              "vehicle_id": os.environ["GPS_E2E_VEHICLE_ID"],
              "dbt_row_count": rows[0][2],
          }, sort_keys=True))
          print("PASS: ONE SAME EVENT from Chromium/API→outbox→Kafka→PostGIS→Parquet→dbt; no duplicates")
          PY

      - name: Independently reconcile source order, published route events and dbt GPS fact
        run: |
          python backend/scripts/reconcile_order_dispatch_gps_dbt_ci.py \
            --order "$RUNNER_TEMP/order-dispatch.json" \
            --gps "$RUNNER_TEMP/browser-origin.json" \
            --analytics "$RUNNER_TEMP/analytics-observed.json" \
            --output "$RUNNER_TEMP/order-gps-dbt-association.json"

      - name: Publish inspectable full-chain evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fleetflow-same-event-gps-browser-dbt
          path: |
            ${{ runner.temp }}/solver-approval-slice.xml
            ${{ runner.temp }}/order-dispatch.json
            ${{ runner.temp }}/analytics-observed.json
            ${{ runner.temp }}/order-gps-dbt-association.json
            ${{ runner.temp }}/browser-origin.json
            ${{ runner.temp }}/browser-gps.jsonl
            ${{ runner.temp }}/replay.json
            ${{ runner.temp }}/reconciled.json
            ${{ runner.temp }}/loaded-first.json
            ${{ runner.temp }}/loaded-second.json
            data-engineering/dbt/target/run_results.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve CI diagnostics on failure
        if: failure()
        run: |
          for file in "$RUNNER_TEMP/gps-api.log" "$RUNNER_TEMP/gps-outbox.log"; do
            if [ -f "$file" ]; then tail -100 "$file"; fi
          done
          docker logs --tail 70 fleetflow-redpanda || true

      - name: Save browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gps-full-stack-playwright-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary broker
        if: always()
        run: docker rm -f fleetflow-redpanda || true
