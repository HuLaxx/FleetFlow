name: FleetFlow P2 Routing Baselines

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'backend/src/optimization/**'
      - 'backend/tests/test_optimization/**'
      - '.github/workflows/p2-routing-baselines.yml'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'backend/src/optimization/**'
      - 'backend/tests/test_optimization/**'
      - '.github/workflows/p2-routing-baselines.yml'

concurrency:
  group: p2-routing-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  routing-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JWT_SECRET_KEY: routing-ci-synthetic-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install actual OR-Tools runtime and test tooling
        run: |
          python -m pip install -e './backend[dev]'
      - name: Execute real constrained OR-Tools and two named baseline heuristics
        run: |
          python -m src.optimization.heuristic_baselines \
            --solver-seconds 1 --output "$RUNNER_TEMP/fleetflow-routing-synthetic-results.json"
          python -m pytest backend/tests/test_optimization/test_heuristic_baselines.py -q
      - name: Validate benchmark artifact and mark infeasibility honestly
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "fleetflow-routing-synthetic-results.json"
          report = json.loads(p.read_text())
          rows = report["results"]
          assert len(rows) == 9
          assert sum(1 for r in rows if r["method"] == "ortools_cvrptw") == 3
          assert any(not r["is_feasible"] for r in rows)
          assert all(not r["is_feasible"] or r["illustrative_cost_gbp"] is not None for r in rows)
          assert all(r["is_feasible"] or r["illustrative_cost_gbp"] is None for r in rows)
          print("Benchmark artifact reconciled: 3 scenarios, 3 methods, no fabricated infeasible cost")
          print("scenario | method | served/orders | unassigned | violations | km | duration_min | solve_ms | illustrative_gbp")
          for item in rows:
              print(f"{item['scenario']} | {item['method']} | {item['served']}/{item['orders']} | "
                    f"{item['unassigned']} | {item['constraint_violations']} | "
                    f"{item['total_distance_km']} | {item['total_duration_minutes']} | "
                    f"{item['solve_time_ms']} | {item['illustrative_cost_gbp']}")
          PY
      - name: Preserve measured result JSON for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetflow-routing-baseline-evidence
          path: ${{ runner.temp }}/fleetflow-routing-synthetic-results.json
          if-no-files-found: error
          retention-days: 14
