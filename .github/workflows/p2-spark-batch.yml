name: FleetFlow P2 Real Spark Batch
on:
  push:
    branches: ['feature/**', 'fix/**']
    paths:
      - 'data-engineering/spark/**'
      - '.github/workflows/p2-spark-batch.yml'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'data-engineering/spark/**'
      - '.github/workflows/p2-spark-batch.yml'
permissions:
  contents: read
jobs:
  real-local-pyspark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: data-engineering/spark
      SPARK_LOCAL_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyspark==3.5.6' 'pytest==8.3.5'
      - name: Compile and run real local Spark assertions
        run: |
          python -m py_compile data-engineering/spark/fleetflow_batch.py data-engineering/spark/test_fleetflow_batch.py
          python -m pytest -q data-engineering/spark/test_fleetflow_batch.py
