name: FleetFlow GPS Spark Structured Streaming

# Real Kafka broker (service container) -> Spark Structured Streaming ->
# validated, de-duplicated Parquet. Proves exactly-once output, de-duplication,
# late-data handling and measures throughput. Synthetic data, no cloud.
on:
  push:
    branches: [main]
    paths:
      - 'data-engineering/streaming/**'
      - '.github/workflows/spark-streaming.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data-engineering/streaming/**'
      - '.github/workflows/spark-streaming.yml'

permissions:
  contents: read

concurrency:
  group: fleetflow-spark-streaming-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  streaming:
    name: Kafka -> Spark Structured Streaming -> Parquet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install "pyspark==3.5.3" "pytest==8.3.4"
      - name: Wait for the broker
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && exit 0; sleep 2; done
          echo "Kafka did not open port 9092"; exit 1
      - name: Offline logic tests and real-broker streaming test
        env:
          KAFKA_BOOTSTRAP: 127.0.0.1:9092
        run: python -m pytest data-engineering/streaming/tests -v
      - name: Throughput benchmark (200,000 synthetic events)
        env:
          PYTHONPATH: data-engineering
        run: python -m streaming.bench --bootstrap 127.0.0.1:9092 --events 200000 --output stream_bench.json
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-stream-benchmark
          path: stream_bench.json
          if-no-files-found: warn
          retention-days: 14
