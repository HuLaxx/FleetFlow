version: 2

sources:
  - name: raw
    schema: public
    tables:
      - name: orders
        description: Raw order data from the transactional database
      - name: drivers
        description: Raw driver data
      - name: vehicles
        description: Raw vehicle data
      - name: routes
        description: Raw route data
      - name: route_stops
        description: Raw route stop data
      - name: depots
        description: Raw depot/warehouse data
      - name: customers
        description: Raw customer data
      - name: gps_hourly_curated
        description: Reconciled hourly GPS events loaded from immutable local Parquet
        columns:
          - name: run_key
            tests:
              - not_null
          - name: vehicle_id
            tests:
              - not_null
          - name: hour_utc
            tests:
              - not_null

      - name: gps_route_events
        description: Exact native-route GPS events from verified immutable local replay
        columns:
          - name: route_id
            tests:
              - not_null
          - name: event_id
            tests:
              - not_null

models:
  - name: fct_gps_route_events
    description: Event-level native route lineage from the authenticated GPS path
    columns:
      - name: gps_route_event_key
        tests:
          - unique
          - not_null
      - name: route_id
        tests:
          - not_null
      - name: event_id
        tests:
          - not_null

  - name: stg_orders
    description: Cleaned and standardized order data
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_number
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['pending', 'assigned', 'in_transit', 'arrived', 'delivered', 'failed', 'cancelled', 'rescheduled']
      - name: priority
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              
  - name: stg_drivers
    description: Cleaned driver data with derived fields
    columns:
      - name: driver_id
        tests:
          - unique
          - not_null
      - name: employee_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['available', 'on_route', 'on_break', 'offline']
              
  - name: stg_routes
    description: Cleaned route data with variance calculations
    columns:
      - name: route_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['planned', 'in_progress', 'completed', 'cancelled']

  - name: stg_gps_hourly
    description: >-
      Staged, lineage-preserving vehicle/hour GPS observations from immutable
      content-addressed local Parquet runs (not production fleet telemetry).
    columns:
      - name: gps_hour_key
        tests:
          - unique
          - not_null
      - name: run_key
        tests:
          - not_null
      - name: vehicle_id
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null

  - name: fct_gps_hourly
    description: >-
      Reconciled GPS hours with observed late-event rates; no invented
      availability or delivery efficiency figures.
    columns:
      - name: gps_hour_key
        tests:
          - unique
          - not_null
      - name: event_count
        tests:
          - not_null
      - name: last_event_time
        tests:
          - not_null
      - name: vehicle_run_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_observed_vehicle')
              field: vehicle_run_key
      - name: utc_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_utc_date')
              field: utc_date_key
