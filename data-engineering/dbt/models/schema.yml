version: 2

sources:
  - name: raw
    schema: public
    # Freshness SLAs, checked by `dbt source freshness` and exported as
    # Prometheus metrics by data-engineering/observability. Reference tables
    # (depots, vehicles, customers) change rarely, so they have no SLA.
    freshness: null
    tables:
      - name: orders
        description: Raw order data from the transactional database
        # New orders arrive continuously during trading hours.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
      - name: drivers
        description: Raw driver data
        # Driver status changes at least once per shift.
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
      - name: vehicles
        description: Raw vehicle data
      - name: routes
        description: Raw route data
        # Routes are planned daily and progress through statuses during the day.
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: route_stops
        description: Raw route stop data
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: depots
        description: Raw depot/warehouse data
      - name: customers
        description: Raw customer data

models:
  - name: stg_orders
    description: Cleaned and standardized order data
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_number
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['pending', 'assigned', 'in_transit', 'arrived', 'delivered', 'failed', 'cancelled', 'rescheduled']
      - name: priority
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              
  - name: stg_drivers
    description: Cleaned driver data with derived fields
    columns:
      - name: driver_id
        tests:
          - unique
          - not_null
      - name: employee_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['available', 'on_route', 'on_break', 'offline']
              
  - name: stg_routes
    description: Cleaned route data with variance calculations
    columns:
      - name: route_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['planned', 'in_progress', 'completed', 'cancelled']
