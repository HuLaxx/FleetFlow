version: 2

sources:
  - name: raw
    description: Transactional PostGIS (not the GPS Parquet replay). No customer PII is promoted to marts.
    schema: public
    tables:
      - name: orders
      - name: drivers
      - name: routes

models:
  - name: stg_orders
    description: One current transactional row per order. Not an append-only event fact.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_number
        data_tests: [unique, not_null]
      - name: delivery_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'assigned', 'in_transit', 'arrived', 'delivered', 'failed', 'cancelled', 'rescheduled']
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_drivers
    description: Privacy-reduced driver staging. No names or contact columns.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['available', 'on_route', 'on_break', 'offline']

  - name: stg_routes
    description: Planned and observed route facts remain separate; zero is not used for missing telemetry.
    columns:
      - name: route_id
        data_tests: [unique, not_null]
      - name: route_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['planned', 'approved', 'in_progress', 'completed', 'cancelled']

  - name: fct_daily_performance
    description: One record per date present in orders or routes, measured metrics nullable when unknown.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: total_orders
        data_tests: [not_null]
      - name: total_routes
        data_tests: [not_null]

  - name: dim_driver_performance
    description: Internal non-contact dimension; aggregate only measured performance, no fabricated speed.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
