version: 2

sources:
  - name: raw
    description: Transactional PostGIS (not the GPS Parquet replay). No customer PII is promoted to marts.
    schema: public
    tables:
      - name: orders
      - name: drivers
      - name: routes
        description: Raw route data
      - name: route_stops
        description: Raw route stop data
      - name: depots
        description: Raw depot/warehouse data
      - name: customers
        description: Raw customer data
      - name: gps_hourly_curated
        description: Reconciled hourly GPS events loaded from immutable local Parquet
        columns:
          - name: run_key
            tests:
              - not_null
          - name: vehicle_id
            tests:
              - not_null
          - name: hour_utc
            tests:
              - not_null

      - name: gps_route_events
        description: Exact native-route GPS events from verified immutable local replay
        columns:
          - name: route_id
            tests:
              - not_null
          - name: event_id
            tests:
              - not_null

models:
  - name: fct_gps_route_events
    description: Event-level native route lineage from the authenticated GPS path
    columns:
      - name: gps_route_event_key
        tests:
          - unique
          - not_null
      - name: route_id
        tests:
          - not_null
      - name: event_id
        tests:
          - not_null

  - name: stg_orders
    description: One current transactional row per order. Not an append-only event fact.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_number
        data_tests: [unique, not_null]
      - name: delivery_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'assigned', 'in_transit', 'arrived', 'delivered', 'failed', 'cancelled', 'rescheduled']
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_drivers
    description: Privacy-reduced driver staging. No names or contact columns.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['available', 'on_route', 'on_break', 'offline']

  - name: stg_routes
    description: Planned and observed route facts remain separate; zero is not used for missing telemetry.
    columns:
      - name: route_id
        data_tests: [unique, not_null]
      - name: route_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['planned', 'in_progress', 'completed', 'cancelled']

  - name: stg_gps_hourly
    description: >-
      Staged, lineage-preserving vehicle/hour GPS observations from immutable
      content-addressed local Parquet runs (not production fleet telemetry).
    columns:
      - name: gps_hour_key
        tests:
          - unique
          - not_null
      - name: run_key
        tests:
          - not_null
      - name: vehicle_id
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null

  - name: fct_gps_hourly
    description: >-
      Reconciled GPS hours with observed late-event rates; no invented
      availability or delivery efficiency figures.
    columns:
      - name: gps_hour_key
        tests:
          - unique
          - not_null
      - name: event_count
        tests:
          - not_null
      - name: last_event_time
        tests:
          - not_null
      - name: vehicle_run_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_observed_vehicle')
              field: vehicle_run_key
      - name: utc_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_utc_date')
              field: utc_date_key
              arguments:
                values: ['planned', 'approved', 'in_progress', 'completed', 'cancelled']

  - name: fct_daily_performance
    description: One record per date present in orders or routes, measured metrics nullable when unknown.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: total_orders
        data_tests: [not_null]
      - name: total_routes
        data_tests: [not_null]

  - name: dim_driver_performance
    description: Internal non-contact dimension; aggregate only measured performance, no fabricated speed.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
