[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetflow-observability"
version = "0.1.0"
description = "Pipeline run metrics, dbt source freshness and failure alerts for FleetFlow (stdlib only)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["fleetflow_observability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.coverage.run]
source = ["fleetflow_observability"]
branch = true
