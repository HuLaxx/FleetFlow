services:
  # ============================================
  # FleetFlow Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetflow-backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - TIMESCALE_HOST=timescale
      - TIMESCALE_PORT=5432
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a random secret in your local .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - postgres
      - timescale
      - redis
      - kafka
    networks:
      - fleetflow-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # FleetFlow WebSocket Server (Real-time Updates)
  # ============================================
  websocket:
    build:
      context: ./backend
      dockerfile: Dockerfile.websocket
    container_name: fleetflow-websocket
    ports:
      - "${WS_PORT:-8002}:8002"
    environment:
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      - redis
      - kafka
    networks:
      - fleetflow-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # PostgreSQL + PostGIS (Main Database)
  # ============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fleetflow-postgres
    environment:
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow_dev
      POSTGRES_DB: fleetflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleetflow -d fleetflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetflow-network

  # ============================================
  # TimescaleDB (Time-Series Data)
  # ============================================
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: fleetflow-timescale
    environment:
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow_dev
      POSTGRES_DB: timescale
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleetflow -d timescale" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetflow-network

  # ============================================
  # Redis (Caching + Geospatial Indexing)
  # ============================================
  redis:
    image: redis:7.4-alpine
    container_name: fleetflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetflow-network

  # ============================================
  # MongoDB (Document Store - Driver Profiles)
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: fleetflow-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: fleetflow
      MONGO_INITDB_ROOT_PASSWORD: fleetflow_dev
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetflow-network

  # ============================================
  # Zookeeper (Kafka Coordination)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fleetflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - fleetflow-network

  # ============================================
  # Kafka (Event Streaming)
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fleetflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - fleetflow-network

  # ============================================
  # Kafka UI (Monitoring Dashboard)
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fleetflow-kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - fleetflow-network

  # ============================================
  # Airflow (Orchestration)
  # ============================================
  airflow:
    image: apache/airflow:2.8.2
    container_name: fleetflow-airflow
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
    volumes:
      - ./data-engineering/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    command: airflow standalone
    profiles:
      - data
    networks:
      - fleetflow-network

  # ============================================
  # Flink (Stream Processing)
  # ============================================
  flink-jobmanager:
    image: flink:1.18.1
    container_name: fleetflow-flink-jobmanager
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    ports:
      - "${FLINK_PORT:-8082}:8081"
    volumes:
      - ./data-engineering/flink:/opt/flink/usrlib
    profiles:
      - data
    networks:
      - fleetflow-network

  flink-taskmanager:
    image: flink:1.18.1
    container_name: fleetflow-flink-taskmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
    depends_on:
      - flink-jobmanager
    profiles:
      - data
    networks:
      - fleetflow-network

  # ============================================
  # MLflow (Model Tracking)
  # ============================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: fleetflow-mlflow
    working_dir: /mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5001"
    profiles:
      - ml
    networks:
      - fleetflow-network

  # ============================================
  # OSRM (Open Source Routing Machine)
  # ============================================
  osrm:
    image: osrm/osrm-backend
    container_name: fleetflow-osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-us-northeast-latest.osrm}
    networks:
      - fleetflow-network
    profiles:
      - routing

# ============================================
# Networks
# ============================================
networks:
  fleetflow-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  timescale_data:
  redis_data:
  mongo_data:
  zookeeper_data:
  kafka_data:
  osrm_data:
  airflow_logs:
  mlflow_data:
