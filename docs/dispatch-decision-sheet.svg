<rect x="731" y="106" width="433" height="307" rx="12" fill="#132d33" stroke="#6e918b" stroke-width="1.6"/>
<g fill="none" stroke="#568076" stroke-opacity=".28" stroke-width="6">
<path d="M763 150H1129M763 203H1129M763 256H1129M763 309H1129M763 362H1129"/>
<path d="M799 142V384M867 142V384M935 142V384M1003 142V384M1071 142V384"/>
</g>
<text x="754" y="137" fill="#a8edd2" font-family="monospace" font-size="12" letter-spacing="1.3">ROUTE PROPOSAL / PREVIEW</text>
<path d="M797 362V309H866V256H935V204H1072V151H1134" fill="none" stroke="#89f0c7" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M797 362H935V309H1002V362H1134V257" fill="none" stroke="#8cccf2" stroke-width="3.2" stroke-linejoin="round" stroke-dasharray="11 9" stroke-dashoffset="0">
 <animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" repeatCount="indefinite"/>
</path>
<circle cx="797" cy="362" r="12" fill="#194c47" stroke="#baf8d8" stroke-width="2"/><text x="797" y="366" fill="#e6fff2" font-family="monospace" font-size="11" text-anchor="middle">D</text>
<g fill="#eafded" stroke="#3d7b64" stroke-width="1.6"><circle cx="866" cy="256" r="6"/><circle cx="1072" cy="151" r="6"/><circle cx="1134" cy="257" r="6"/></g>
<rect x="748" y="373" width="397" height="26" rx="5" fill="#234b48"/>
<text x="761" y="390" fill="#b8f6d5" font-family="monospace" font-size="11">OPTIMIZER RETURNS A PLAN · NOT AUTO-APPLIED</text>
<!-- bottom ledger -->
<g font-family="monospace" font-size="12" letter-spacing=".4">
<text x="39" y="460" fill="#486b67">NEXT: REVIEW PLAN → DISPATCH WORKFLOW → OBSERVE GPS / EVENT UPDATES</text>
<text x="1160" y="460" text-anchor="end" fill="#ab7b52">CONCEPTUAL SCHEMATIC / NOT MEASURED ROUTES</text>
</g>
</g></svg>