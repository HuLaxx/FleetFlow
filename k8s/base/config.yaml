apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetflow-config
  namespace: fleetflow
data:
  APP_NAME: "FleetFlow API"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fleetflow"
  ENABLE_WEBSOCKET: "true"
  ENABLE_MOCK_DATA: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: fleetflow-secrets
  namespace: fleetflow
type: Opaque
stringData:
  POSTGRES_USER: fleetflow
  POSTGRES_PASSWORD: CHANGEME_IN_PRODUCTION
  JWT_SECRET_KEY: CHANGEME_GENERATE_SECURE_KEY_32_CHARS_MIN
  SENTRY_DSN: ""
  TOMTOM_API_KEY: ""
