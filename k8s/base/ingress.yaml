apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetflow-ingress
  namespace: fleetflow
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fleetflow.example.com
        - api.fleetflow.example.com
        - ws.fleetflow.example.com
      secretName: fleetflow-tls
  rules:
    # Frontend
    - host: fleetflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleetflow-frontend
                port:
                  number: 3000
    # API
    - host: api.fleetflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleetflow-api
                port:
                  number: 8000
    # WebSocket
    - host: ws.fleetflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleetflow-websocket
                port:
                  number: 8002
