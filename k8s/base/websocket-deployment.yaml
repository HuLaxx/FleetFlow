apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetflow-websocket
  namespace: fleetflow
  labels:
    app: fleetflow
    component: websocket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleetflow
      component: websocket
  template:
    metadata:
      labels:
        app: fleetflow
        component: websocket
    spec:
      containers:
        - name: websocket
          image: fleetflow/websocket:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: ws
          envFrom:
            - configMapRef:
                name: fleetflow-config
            - secretRef:
                name: fleetflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fleetflow-websocket
  namespace: fleetflow
  labels:
    app: fleetflow
    component: websocket
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: ws
  selector:
    app: fleetflow
    component: websocket
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleetflow-websocket-hpa
  namespace: fleetflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fleetflow-websocket
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
