# Disposable in-cluster dependencies named to match k8s/base/config.yaml
# (POSTGRES_HOST=postgres, KAFKA_BOOTSTRAP_SERVERS=kafka:9092).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fleetflow
spec:
  replicas: 1
  selector:
    matchLabels: {component: postgres}
  template:
    metadata:
      labels: {component: postgres}
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:15-3.3
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: fleetflow-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: fleetflow-secrets, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: fleetflow-config, key: POSTGRES_DB}}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fleetflow
spec:
  selector: {component: postgres}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: fleetflow
spec:
  replicas: 1
  selector:
    matchLabels: {component: kafka}
  template:
    metadata:
      labels: {component: kafka}
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v25.1.1
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://kafka:9092
            - --check=false
          ports:
            - containerPort: 9092
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fleetflow
spec:
  selector: {component: kafka}
  ports:
    - port: 9092
      targetPort: 9092
