[project]
name = "fleetflow-ml"
version = "1.0.0"
description = "FleetFlow ML/AI Package - Forecasting, Optimization, and Inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "annotated-types>=0.7.0",
    "anyio>=4.8.0",
    "ortools>=9.8.0",
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "optuna>=3.5.0",
    "mlflow>=2.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    
    # Forecasting
    "prophet>=1.1.0",
    "xgboost>=2.0.0",
    
    # Deep Learning
    "tensorflow>=2.14.0",
    
    # Optimization
    "ortools>=9.7.0",
    
    # MLflow
    "mlflow>=2.9.0",
    
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    
    # Streaming
    "aiokafka>=0.10.0",
    
    # Utilities
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
